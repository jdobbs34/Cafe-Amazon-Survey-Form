<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cafe Amazon Survey Form</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
<div class="header">
	<h1 id="title">Cafe Amazon Survey Form</h1>
	<p id="description">Thank you for taking to give us feedback and help us improve our services</p>
</div>	

<div class="container">

	<form id="survey-form">
		<label for="name" id="name-label">Name</label>
		<input type="text" name="name" id="name" placeholder="Enter you name" required>
		<label for="email" id="email-label">Email</label>
		<input type="email" name="email" id="email" placeholder="Enter you email" required>
		<label for="number" id="number-label">Age (optional)</label>
		<input type="number" name="number" id="number"  min="10" max="99" placeholder="Age">
		
		<label for="dropdown" id="dropdown-label">Which option best describes your current role?</label>
		<select name="dropdown" id="dropdown">
			<option disabled selected value>Select current role</option>
			<option value="option1">Student</option>
			<option value="option2">Teacher</option>
			<option value="option3">Other</option>
		</select>
		
		
		<label>Would you recommend Cafe Amazon to a friend?</label>
		<div class="radio-group">
			<div>
				<input type="radio" value="1" name="choice" id="option1">
				<label for="option1">Definitely</label>
			</div>
			<div>
				<input type="radio" value="2" name="choice" id="option2">
				<label for="option2">Maybe</label>
			</div>
			<div>
				<input type="radio" value="3" name="choice" id="option3">
				<label for="option3">Not sure</label>
			</div>
		</div>
		
		<label for="dropdown" id="dropdown-label">What do you like the most about Cafe Amazon?</label>
		<select name="dropdown" id="dropdown">
			<option disabled selected value>Select your option</option>
			<option value="option1">Coffee</option>
			<option value="option2">Drinks</option>
			<option value="option3">Food</option>
			<option value="option4">Atmosphere</option>
		</select>
		
		
		<label>What would you like to see improved? (Check all that apply)</label>
		<div class="checkbox-group">
			<div>
				<input type="checkbox" value="option1" name="improvement" id="improvement1">
				<label for="improvement1">Service</label>
			</div>
			<div>
				<input type="checkbox" value="option2" name="improvement" id="improvement2">
				<label for="improvement2">Menu Variety</label>
			</div>
			<div>
				<input type="checkbox" value="option3" name="improvement"id="improvement3">
				<label for="improvement3">Pricing</label>
			</div>
			<div>
				<input type="checkbox" value="option4" name="improvement" id="improvement4">
				<label for="improvement4">Ambiance</label>
			</div>
		</div>
		
		<label>Any comments or suggestions?</label>
		<textarea name="comment" id="comments" placeholder="Enter your comments here..."></textarea>
		
		<button id="submit" type="submit">Submit</button>
	</form>

</body>
</html>
